<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vocabulario</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1e4f1; /* COLOR DE FONDO DE LA PÁGINA (el lila de la tarjeta de Oxford) */
    }

    .card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      width: min(750px, 90vw); /* ANCHO DE LA TARJETA */
      max-height: 80vh;
      overflow-y: scroll;
      padding: 8px 24px;
    }
    .card::-webkit-scrollbar { display: none; }
    .card { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

<div class="card" id="card">
    <p style="color:#07579c; font-size: 30px;">One</p>
    <p>Como sustantivo se usa en estos contextos:</p>
    <ol>
      <li>Para nombrar  el número 1 la ci.<br>Write a one on the board. (Escribe un uno en la pizarra.)</li>
    </ol>
</div>
</body>
</html>
